<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#05030c">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piyaster Piano</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05030c;color:#e8e6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:rgba(10,6,25,.85);border-bottom:1px solid #2a1f55;z-index:2}
h1{font-size:18px;margin:0 8px 0 0;background:linear-gradient(90deg,#0ff,#f0f,#ff0);-webkit-background-clip:text;color:transparent;text-shadow:0 0 12px rgba(255,0,255,.4);white-space:nowrap}
input[type=text]{flex:1 1 220px;min-width:150px;padding:8px 10px;border-radius:8px;border:1px solid #5b3fd1;background:#0d0820;color:#fff;font-size:15px;outline:none;box-shadow:0 0 8px #5b3fd155 inset}
button,.btn{padding:8px 12px;border-radius:8px;border:1px solid #7a5cff;background:#1a1040;color:#fff;font-size:14px;cursor:pointer;box-shadow:0 0 8px #7a5cff66}
button:hover,.btn:hover{background:#2a1a66}
button.primary{background:linear-gradient(90deg,#00e5ff,#c400ff);border:none;font-weight:700;color:#05030c}
label{font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}
input[type=range]{width:90px;accent-color:#c400ff}
#msg{font-size:13px;color:#9fe8ff;padding:4px 10px;min-height:22px;background:rgba(10,6,25,.6);z-index:2}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#lib{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px;background:rgba(10,6,25,.6);z-index:2}
#lib span{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid #3d2a8a;cursor:pointer;color:#cbbcff}
#lib span.mine{border-color:#ff4fd8;color:#ffc4f3}#lib span i{font-style:normal;margin-left:6px;opacity:.7}#lib span i:hover{color:#f55;opacity:1}#lib b{font-size:12px;color:#ff4fd8;width:100%}
body.drag #stage{outline:3px dashed #ff4fd8;outline-offset:-8px}
#lib span:hover{border-color:#0ff;color:#0ff}
#file{display:none}
#legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px;background:rgba(10,6,25,.6);z-index:2}#legend:empty{display:none}
.hand{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--c,#7a5cff);background:#0d0820;color:#fff;box-shadow:0 0 8px var(--c,#7a5cff);display:inline-flex;align-items:center;gap:6px}.hand i{width:10px;height:10px;border-radius:3px;background:var(--c,#7a5cff);box-shadow:0 0 6px var(--c)}.hand.off{opacity:.45;box-shadow:none}
@media (max-width:640px){h1{font-size:15px}header{gap:6px;padding:6px}button,.btn{padding:7px 9px;font-size:13px}input[type=range]{width:70px}#lib{max-height:52px;overflow:auto}}
</style></head><body>
<div id="app">
<header>
<h1>✦ Piyaster Piano</h1>
<input id="song" type="text" placeholder="Song name, or notes: RH: E5 D5 C5 LH: C3+E3+G3:3" autocomplete="off">
<button id="play" class="primary">▶ Play</button>
<button id="pause">⏸</button>
<button id="stop">⏹</button>
<label class="btn" for="file">🎵 MIDI</label><input id="file" type="file" accept=".mid,.midi">
<button id="save" title="Save the loaded song to My Songs">💾 Save</button>
<label>Tempo <input id="tempo" type="range" min="0.4" max="2" step="0.05" value="1"><span id="tv">1.0×</span></label>
<label>Vol <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7"></label>
</header>
<div id="msg">Type a song name and press Play, click a song below, or play the keys (keyboard: A W S E D F T G Y H U J K…).</div>
<div id="legend"></div>
<div id="lib"></div>
<div id="stage"><canvas id="cv"></canvas></div>
</div>
<script src="songs.js"></script>
<script src="app.js"></script>
</body></html>
