<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎹%3C/text%3E%3C/svg%3E"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#030204">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piyaster Piano</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030204;color:#f6e9f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header,#settings{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:rgba(14,6,12,.92);z-index:2}
header{border-bottom:1px solid #3a1426}
h1{font-size:17px;margin:0 6px 0 0;font-style:italic;background:linear-gradient(90deg,#ffd1e3,#ff8fbf,#e9b3ff);-webkit-background-clip:text;color:transparent;white-space:nowrap}
input[type=text]{flex:1 1 200px;min-width:140px;padding:7px 10px;border-radius:8px;border:1px solid #6b2a4a;background:#12060d;color:#fff;font-size:15px;outline:none}
input[type=text]:focus{border-color:#ff8fbf;box-shadow:0 0 10px #ff8fbf55}
button,.btn,select{padding:7px 11px;border-radius:8px;border:1px solid #6b2a4a;background:#1c0a14;color:#fde8f1;font-size:13px;cursor:pointer}
button:hover,.btn:hover{background:#2c1020;border-color:#ff8fbf}
button.primary{background:linear-gradient(90deg,#ffb3d1,#ff7fb5);border:none;font-weight:700;color:#2a0614;box-shadow:0 0 12px #ff8fbf88}
button.on{background:#3d1328;border-color:#ff8fbf;box-shadow:0 0 10px #ff8fbf66}
label{font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}
input[type=range]{width:90px;accent-color:#ff8fbf}
#settings{display:none;border-bottom:1px solid #3a1426}body.show-settings #settings{display:flex}
#msg{font-size:13px;color:#ffc9de;padding:3px 10px;min-height:20px;background:rgba(14,6,12,.7);z-index:2}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#lib{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px;background:rgba(14,6,12,.7);z-index:2;max-height:34vh;overflow:auto}
#msg a.find{display:inline-block;margin:3px 2px;padding:4px 9px;border-radius:999px;border:1px solid #ff8fbf;color:#fff;text-decoration:none;background:#2c1020;font-size:12px}#msg a.find:hover{background:#4a1631}#msg .dim{opacity:.7;font-size:12px}
body.hide-lib #lib{display:none}
#lib span{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid #4a1c33;cursor:pointer;color:#f3c6d9}
#lib span.mine{border-color:#c88bff;color:#e6cbff}#lib span i{font-style:normal;margin-left:6px;opacity:.7}#lib span i:hover{color:#f55;opacity:1}#lib b{font-size:12px;color:#ff8fbf;width:100%;margin-top:4px}#lib small{margin-left:6px;opacity:.55;font-size:10px}#lib .credits{font-size:11px;color:#c99;width:100%;margin-top:4px}
#lib span:hover{border-color:#ff8fbf;color:#fff}
body.drag #stage{outline:3px dashed #ff8fbf;outline-offset:-8px}
#file{display:none}
#loading{position:fixed;left:50%;transform:translateX(-50%);top:60px;z-index:5;font-size:13px;padding:7px 12px;border-radius:10px;background:#1c0a14;border:1px solid #ff8fbf;box-shadow:0 0 14px #ff8fbf66;transition:opacity .6s}#loading.hide{opacity:0;pointer-events:none}
#legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px;background:rgba(14,6,12,.7);z-index:2}#legend:empty{display:none}
.hand{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--c,#ff8fbf);background:#12060d;color:#fff;box-shadow:0 0 8px var(--c,#ff8fbf);display:inline-flex;align-items:center;gap:6px}.hand i{width:10px;height:10px;border-radius:3px;background:var(--c);box-shadow:0 0 6px var(--c)}.hand.off{opacity:.45;box-shadow:none}
#main{flex:1;min-height:0;display:flex;position:relative}#main #stage{flex:1;min-width:0}
#pl{display:none;flex-direction:column;gap:6px;width:280px;flex:0 0 280px;padding:8px;background:rgba(14,6,12,.94);border-left:1px solid #3a1426;overflow:auto;z-index:3}
body.pl-open #pl{display:flex}
.plh{display:flex;align-items:center;gap:6px}.plh b{color:#ff8fbf;font-size:14px}.plh small{opacity:.6;font-size:11px;flex:1}#plx{padding:3px 8px}
#plnow{font-size:12px;color:#ffd9e8;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#plnow .dim{opacity:.6}
.plc{display:flex;gap:4px}.plc button{padding:5px 8px}.plc .primary{flex:1}
#plpresets{display:flex;flex-wrap:wrap;gap:4px;font-size:11px}#plpresets .lbl{opacity:.7;width:100%}
#plpresets span[data-c],#plsaved span{padding:3px 8px;border-radius:999px;border:1px solid #4a1c33;cursor:pointer;color:#f3c6d9;font-size:11px}#plpresets span[data-c]:hover,#plsaved span:hover{border-color:#ff8fbf;color:#fff}
#pl>*{flex-shrink:0}#pl>#plq{flex:1 1 0;min-height:90px;overflow:auto}
#plq{list-style:none;margin:0;padding:0 2px 0 0;display:flex;flex-direction:column;gap:2px;counter-reset:q}#plq li{flex-shrink:0}
#plq li{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 6px;border-radius:7px;background:#160810;border:1px solid transparent;counter-increment:q}
#plq li::before{content:counter(q);opacity:.4;font-size:10px;min-width:14px;text-align:right}
#plq li .nm{flex:1;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#plq li small{opacity:.55;font-size:10px}
#plq li i{font-style:normal;opacity:.5;cursor:pointer}#plq li i:hover{color:#f55;opacity:1}
#plq .grip{cursor:grab;opacity:.55;touch-action:none;padding:0 2px;user-select:none}
#plq li.now{border-color:#ff8fbf;background:#2c1020;box-shadow:0 0 10px #ff8fbf55}#plq li.now .nm{color:#fff;font-weight:600}
#plq li.dragging{opacity:.5}#plq li.drop{box-shadow:0 -2px 0 #ff8fbf}#plq.drop-end li:last-child{box-shadow:0 2px 0 #ff8fbf}
.pls{display:flex;gap:4px}.pls input[type=text]{flex:1;min-width:0;font-size:12px;padding:5px 8px}.pls button{padding:5px 8px}
#plsaved{display:flex;flex-wrap:wrap;gap:4px}#plsaved i{font-style:normal;margin-left:5px;opacity:.6}#plsaved i:hover{color:#f55;opacity:1}#plsaved .dim{opacity:.5;font-size:11px}
#lib span em.add{font-style:normal;margin-right:5px;padding:0 4px;border-radius:5px;background:#2c1020;color:#ff8fbf;font-weight:700}#lib span em.add:hover{background:#ff8fbf;color:#2a0614}#lib span em.add.ok{background:#5c5;color:#031}
#lib span.xm{border-color:#5a2a1c}
body.cinema #pl{display:none!important}
@media (max-width:899px){#pl{display:flex;position:fixed;top:0;right:0;bottom:0;width:min(86vw,320px);transform:translateX(105%);transition:transform .25s ease;box-shadow:-8px 0 30px #000a;z-index:7}body.pl-open #pl{transform:none}}
body.cinema header,body.cinema #settings,body.cinema #msg,body.cinema #lib,body.cinema #legend{display:none}
body.cinema #fsx{display:block}#fsx{display:none;position:fixed;top:8px;right:8px;z-index:6;opacity:.5}
@media (max-width:640px){h1{font-size:14px}header{gap:5px;padding:5px}button,.btn,select{padding:6px 8px;font-size:12px}input[type=range]{width:70px}#lib{max-height:56px}.wide{display:none}}
</style></head><body>
<div id="app">
<header>
<h1>✦ Piyaster Piano</h1>
<input id="song" type="text" placeholder="Song name (e.g. Clair de Lune), any title to 🔎 Find, or notes" autocomplete="off">
<button id="play" class="primary">▶ Play</button>
<button id="find" title="Find a free MIDI of any song online">🔎<span class="wide"> Find</span></button>
<button id="pause" title="Pause (Space)">⏸</button>
<button id="stop" title="Stop">⏹</button>
<label class="btn" for="file" title="Load a MIDI file">🎵<span class="wide"> MIDI</span></label><input id="file" type="file" accept=".mid,.midi">
<button id="save" title="Save the loaded song to My Songs">💾<span class="wide"> Save</span></button>
<button id="libbtn" title="Show/hide song list">📚</button>
<button id="plbtn" title="Playlist">🎶<span class="wide"> Playlist</span></button>
<button id="cfg" title="Sound & visual settings">⚙</button>
<button id="fs" title="Cinema / fullscreen">⛶</button>
</header>
<div id="settings">
<button id="sus" title="Sustain pedal (toggle) — or hold Shift">🦶 Sustain</button>
<button id="rev" title="Concert hall reverb">🏛 Hall</button>
<button id="hum" title="Humanized velocity & timing">🎭 Humanize</button>
<label>Look <select id="theme"><option value="sakura">Sakura glow</option><option value="neon">Neon</option><option value="gold">Gold</option><option value="ice">Ice</option><option value="xmas">Christmas 🎄</option></select></label>
<label>Quality <select id="quality"><option value="auto">Auto</option><option value="high">High</option><option value="low">Low (battery)</option></select></label>
<label>Tempo <input id="tempo" type="range" min="0.4" max="2" step="0.05" value="1"><span id="tv">1.0×</span></label>
<label>Vol <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7"></label>
</div>
<div id="msg">Type a song name and press Play, pick one below, or play the keys (A W S E D F T G Y H U J K… · Shift = pedal). Want another song? Type its title and press 🔎 Find.</div>
<div id="loading">🎹 Loading grand piano…</div>
<div id="legend"></div>
<div id="lib"></div>
<div id="main">
<div id="stage"><canvas id="cv"></canvas></div>
<aside id="pl">
 <div class="plh"><b>🎶 Playlist</b><small id="plcount"></small><button id="plx" title="Close">✕</button></div>
 <div id="plnow"></div>
 <div class="plc"><button id="plprev" title="Previous">⏮</button><button id="plplay" class="primary" title="Play the playlist">▶ Play</button><button id="plnext" title="Next">⏭</button><button id="plshuf" title="Shuffle">🔀</button><button id="plrep" title="Repeat: off">🔁</button><button id="plclear" title="Clear playlist">🗑</button></div>
 <div id="plpresets"><span class="lbl">▶ Play all:</span><span data-c="Christmas">🎄 Christmas</span><span data-c="Classical">Classical</span><span data-c="Ragtime">Ragtime</span><span data-c="Traditional">Traditional</span><span data-c="Simple">Simple</span><span data-c="My Songs">My Songs</span></div>
 <ol id="plq"></ol>
 <div class="pls"><input id="plname" type="text" placeholder="Playlist name" autocomplete="off"><button id="plsave" title="Save this playlist">💾 Save</button></div>
 <div id="plsaved"></div>
</aside>
</div>
</div>
<button id="fsx" onclick="document.getElementById('fs').click()">✕</button>
<script src="songs.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body></html>
